# Builds the SuperVibeCode desktop installers for macOS, Windows and Linux and publishes them as a GitHub release.
#
# Release a version by pushing a tag:   git tag v1.0.0 && git push origin v1.0.0
# or run it from the Actions tab with a version number.
#
# The installers are unsigned unless these optional repository secrets exist:
#   MAC_CERTIFICATE (base64 .p12 Developer ID) and MAC_CERTIFICATE_PASSWORD sign the macOS app;
#   APPLE_API_KEY_BASE64 (.p8), APPLE_API_KEY_ID and APPLE_API_ISSUER also notarize it.
name: supervibecode-release

on:
  push:
    tags:
      - "v[0-9]*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, for example 1.0.0"
        required: true
        type: string

concurrency: supervibecode-release-${{ github.ref }}-${{ inputs.version }}

permissions:
  contents: write

jobs:
  version:
    # The main repository and the fork that builds its releases; never OpenCode's own repository or other forks.
    if: contains(fromJSON('["dhank77/SuperVibeCode", "latjoromhi25d-dotcom/SuperVibeCode"]'), github.repository)
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        shell: bash
        env:
          INPUT: ${{ inputs.version }}
        run: |
          VERSION="${INPUT:-${GITHUB_REF_NAME#v}}"
          VERSION="${VERSION#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Not a semantic version: $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  # The desktop app bundles the SuperVibeCode server. Bun compiles it for every platform from Linux.
  cli:
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target:
          - opencode-darwin-arm64
          - opencode-darwin-x64-baseline
          - opencode-windows-x64-baseline
          - opencode-linux-x64-baseline
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0

      - uses: ./.github/actions/setup-bun
        with:
          bun-version: 1.4.4

      - name: Build
        run: ./packages/cli/script/build.ts --target=${{ matrix.target }}
        env:
          OPENCODE_VERSION: ${{ needs.version.outputs.version }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cli-${{ matrix.target }}
          path: packages/cli/dist/cli-*
          if-no-files-found: error

  desktop:
    needs:
      - version
      - cli
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: macos-26
            target: aarch64-apple-darwin
            cli: opencode-darwin-arm64
            flags: --mac --arm64
          - host: macos-26-intel
            target: x86_64-apple-darwin
            cli: opencode-darwin-x64-baseline
            flags: --mac --x64
          - host: windows-2025
            target: x86_64-pc-windows-msvc
            cli: opencode-windows-x64-baseline
            flags: --win --x64
          - host: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            cli: opencode-linux-x64-baseline
            flags: --linux --x64
    runs-on: ${{ matrix.settings.host }}
    timeout-minutes: 60
    env:
      OPENCODE_VERSION: ${{ needs.version.outputs.version }}
      OPENCODE_CHANNEL: prod
      OPENCODE_CLI_TARGET: ${{ matrix.settings.target }}
      OPENCODE_CLI_DIST: ${{ github.workspace }}/packages/cli/dist
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: cli-${{ matrix.settings.cli }}
          path: packages/cli/dist

      - uses: ./.github/actions/setup-bun

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rpm

      # electron-builder treats an empty CSC_LINK as a path and fails, so signing variables are only set when the
      # secrets exist. Without them the Mac app is ad-hoc signed and not notarized.
      - name: Set up macOS signing
        if: runner.os == 'macOS'
        shell: bash
        env:
          MAC_CERTIFICATE: ${{ secrets.MAC_CERTIFICATE }}
          MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ -z "$MAC_CERTIFICATE" ]; then exit 0; fi
          echo "$MAC_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          echo "CSC_LINK=$RUNNER_TEMP/certificate.p12" >> "$GITHUB_ENV"
          echo "CSC_KEY_PASSWORD=$MAC_CERTIFICATE_PASSWORD" >> "$GITHUB_ENV"
          if [ -n "$APPLE_API_KEY_BASE64" ]; then
            echo "$APPLE_API_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/apple-api-key.p8"
            echo "APPLE_API_KEY=$RUNNER_TEMP/apple-api-key.p8" >> "$GITHUB_ENV"
            echo "APPLE_API_KEY_ID=$APPLE_API_KEY_ID" >> "$GITHUB_ENV"
            echo "APPLE_API_ISSUER=$APPLE_API_ISSUER" >> "$GITHUB_ENV"
          fi

      - name: Prepare
        run: bun ./scripts/prepare.ts
        working-directory: packages/desktop

      - name: Build
        run: bun run build
        working-directory: packages/desktop
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Package
        run: npx electron-builder ${{ matrix.settings.flags }} --publish never --config electron-builder.config.ts
        working-directory: packages/desktop
        timeout-minutes: 45

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-${{ matrix.settings.target }}
          path: |
            packages/desktop/dist/*.dmg
            packages/desktop/dist/*.zip
            packages/desktop/dist/*.exe
            packages/desktop/dist/*.AppImage
            packages/desktop/dist/*.deb
            packages/desktop/dist/*.rpm
            packages/desktop/dist/*.blockmap
            packages/desktop/dist/latest*.yml
          if-no-files-found: error

  release:
    needs:
      - version
      - desktop
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: desktop-*
          path: artifacts

      # Both Mac builds write latest-mac.yml; the app reads one, so it lists both architectures.
      - name: Collect release files
        shell: bash
        run: |
          mkdir release
          bun packages/desktop/scripts/merge-update-manifests.ts release/latest-mac.yml \
            artifacts/desktop-aarch64-apple-darwin/latest-mac.yml artifacts/desktop-x86_64-apple-darwin/latest-mac.yml
          find artifacts -type f ! -name 'latest-mac.yml' -exec cp {} release/ \;
          ls -la release

      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber
          else
            gh release create "$TAG" release/* --target "$GITHUB_SHA" --title "SuperVibeCode $VERSION" --generate-notes
          fi
